app = "baekya-listing-server"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.flyio.listing"

[env]
  NODE_ENV = "production"
  FLY_APP_NAME = "bplisting"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[deploy]
  strategy = "rolling"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
